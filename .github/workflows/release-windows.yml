name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm garmin_workout_generator.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GarminWorkoutGenerator-Windows
          path: dist/GarminWorkoutGenerator.exe
          if-no-files-found: error

      - name: Publish executable in GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GarminWorkoutGenerator.exe
          generate_release_notes: true
